<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PlanningPro</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{color-scheme:dark only;
--bg:#0f0f13;--sur:#16161d;--s2:#1e1e28;--s3:#252533;
--bor:#2e2e3f;--acc:#7c6af5;--a2:#4ecdc4;
--txt:#e8e8f0;--t2:#9090a8;--t3:#606078;
--red:#ff4d6d;--grn:#06d6a0;--org:#f77f00;}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{background:#0f0f13!important;color:var(--txt);font-family:'DM Sans',sans-serif;font-size:13px;min-height:100vh;-webkit-text-size-adjust:100%;}

header{background:var(–sur);border-bottom:1px solid var(–bor);padding:11px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:200;flex-wrap:wrap;}
header h1{font-family:‘Syne’,sans-serif;font-size:18px;font-weight:800;background:linear-gradient(135deg,var(–acc),var(–a2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;white-space:nowrap;}
.hact{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;}

.tabs{display:flex;background:#0f0f13;padding:10px 16px 0;border-bottom:1px solid var(–bor);overflow-x:auto;gap:2px;}
.tab{padding:7px 14px;font-family:‘Syne’,sans-serif;font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;border:none;background:transparent;color:var(–t3);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;}
.tab.active{color:var(–acc);border-bottom-color:var(–acc);}

.page{display:none;}
.page.active{display:flex;flex-direction:column;}

.layout{display:flex;height:calc(100vh - 88px);overflow:hidden;}
.sidebar{width:310px;min-width:310px;background:var(–sur);border-right:1px solid var(–bor);overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px;}
.content{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:12px;}

.panel{background:var(–s2);border:1px solid var(–bor);border-radius:10px;overflow:hidden;}
.ph{padding:9px 12px;font-family:‘Syne’,sans-serif;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(–t2);background:var(–s3);border-bottom:1px solid var(–bor);display:flex;align-items:center;justify-content:space-between;}
.pb{padding:11px;display:flex;flex-direction:column;gap:8px;}

label{font-size:11px;color:var(–t2);margin-bottom:2px;display:block;}
input[type=text],input[type=date],select{background:var(–s3);border:1px solid var(–bor);border-radius:6px;padding:7px 9px;color:var(–txt);font-family:‘DM Sans’,sans-serif;font-size:12px;outline:none;transition:border-color .2s;-webkit-appearance:none;}
input[type=text]:focus,input[type=date]:focus,select:focus{border-color:var(–acc);}
select option{background:var(–s3);}
input[type=week]{background:var(–s3);border:1px solid var(–bor);color:var(–txt);padding:5px 8px;border-radius:6px;font-family:‘DM Mono’,monospace;font-size:11px;-webkit-appearance:none;outline:none;}

.btn{padding:8px 13px;border-radius:7px;border:none;cursor:pointer;font-family:‘Syne’,sans-serif;font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;transition:all .15s;white-space:nowrap;}
.bp{background:var(–acc);color:#fff;}
.bp:hover{background:#9580ff;}
.bs{background:var(–s3);color:var(–t2);border:1px solid var(–bor);}
.bs:hover{color:var(–txt);border-color:var(–acc);}
.br{background:var(–red);color:#fff;}
.bg2{background:rgba(6,214,160,.2);color:var(–grn);border:1px solid rgba(6,214,160,.3);}

.stepper{display:flex;align-items:center;gap:6px;}
.step-btn{width:34px;height:34px;border-radius:6px;border:1px solid var(–bor);background:var(–s3);color:var(–txt);font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.step-val{flex:1;text-align:center;font-family:‘DM Mono’,monospace;font-size:18px;font-weight:700;color:var(–txt);background:var(–s3);border:1px solid var(–bor);border-radius:6px;padding:5px 0;}

.emp-row{background:var(–s3);border:1px solid var(–bor);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:7px;}
.emp-top{display:flex;gap:6px;align-items:center;}
.days-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
.day-cb{display:flex;flex-direction:column;align-items:center;gap:2px;}
.day-cb input[type=checkbox]{accent-color:var(–acc);width:14px;height:14px;}
.day-cb span{font-size:9px;color:var(–t3);font-family:‘DM Mono’,monospace;}
.conge-block{background:rgba(6,214,160,.08);border:1px solid rgba(6,214,160,.2);border-radius:6px;padding:8px;display:flex;flex-direction:column;gap:6px;}
.conge-row{display:flex;gap:5px;align-items:center;}
.conge-row input[type=date]{flex:1;font-size:11px;padding:5px 7px;}

.chip{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:10px;font-family:‘DM Mono’,monospace;}
.ci{background:rgba(124,106,245,.15);color:var(–acc);border:1px solid rgba(124,106,245,.3);}

.wbadge{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;font-family:‘Syne’,sans-serif;}
.ba{background:rgba(124,106,245,.2);color:var(–acc);border:1px solid rgba(124,106,245,.4);}
.bb{background:rgba(78,205,196,.2);color:var(–a2);border:1px solid rgba(78,205,196,.4);}

/* PLANNING TABLE */
.tbl-wrap{background:var(–sur);border:1px solid var(–bor);border-radius:10px;overflow-x:auto;}
table.ptbl{width:100%;border-collapse:collapse;min-width:820px;}
table.ptbl th,table.ptbl td{border:1px solid var(–bor);text-align:center;vertical-align:middle;}
table.ptbl thead th{background:var(–s3);font-family:‘Syne’,sans-serif;font-size:10px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(–t2);padding:7px 4px;}
.col-emp{min-width:110px;text-align:left!important;padding:0 8px!important;background:var(–s2)!important;position:sticky;left:0;z-index:10;}
.day-hdr .dn{font-size:11px;color:var(–txt);font-weight:700;}
.day-hdr .dh{font-size:9px;color:var(–t3);font-family:‘DM Mono’,monospace;}

.cell{padding:6px 4px;min-width:110px;cursor:pointer;transition:filter .15s;}
.cell:hover{filter:brightness(1.18);}
.cell-inner{display:flex;flex-direction:column;align-items:center;gap:1px;}
.slot-time{font-family:‘DM Mono’,monospace;font-size:10px;font-weight:500;color:var(–txt);line-height:1.4;white-space:nowrap;}
.slot-pause{font-size:9px;color:var(–t3);font-family:‘DM Mono’,monospace;}
.cell-repos{background:var(–s2)!important;}
.cell-repos .slot-time{color:var(–t3);}
.cell-conge{background:rgba(6,214,160,.1)!important;}
.cell-conge .slot-time{color:var(–grn);}
.cell-work{background:var(–s2);}
.cell-closed{background:var(–bg)!important;opacity:.35;pointer-events:none;}
.cell-empty{background:var(–s2);}

.hcell{font-family:‘DM Mono’,monospace;font-size:11px;padding:6px 4px;min-width:68px;}
.hok{color:var(–grn);}.hov{color:var(–a2);}.hun{color:var(–red);}
.hval{font-size:13px;font-weight:700;}.hexp{font-size:9px;color:var(–t3);}

.cntrow td{background:var(–s2);font-family:‘DM Mono’,monospace;font-size:10px;padding:4px 3px;}
.cok{color:var(–grn);font-weight:700;}.clow{color:var(–red);font-weight:700;}

/* MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:500;display:flex;align-items:center;justify-content:center;}
.modal{background:var(–sur);border:1px solid var(–bor);border-radius:12px;padding:20px;width:340px;max-width:95vw;display:flex;flex-direction:column;gap:12px;}
.modal h3{font-family:‘Syne’,sans-serif;font-size:15px;font-weight:700;}

.fav-item{background:var(–s3);border:1px solid var(–bor);border-radius:8px;padding:10px;display:flex;align-items:center;gap:8px;}
.fav-name{flex:1;font-size:12px;font-weight:600;}
.fav-meta{font-size:10px;color:var(–t3);font-family:‘DM Mono’,monospace;}

.rcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;}
.rcard{background:var(–sur);border:1px solid var(–bor);border-radius:10px;padding:13px;}

.toast{position:fixed;bottom:20px;right:20px;background:var(–sur);border:1px solid var(–bor);border-radius:10px;padding:11px 16px;color:var(–txt);font-size:12px;box-shadow:0 8px 32px rgba(0,0,0,.5);z-index:999;opacity:0;transform:translateY(8px);transition:all .3s;pointer-events:none;}
.toast.show{opacity:1;transform:translateY(0);}

.auto-btn{background:linear-gradient(135deg,var(–acc),var(–a2));color:#fff;border:none;padding:10px 18px;border-radius:8px;font-family:‘Syne’,sans-serif;font-weight:700;font-size:12px;cursor:pointer;letter-spacing:.5px;width:100%;margin-top:4px;}
.section-title{font-family:‘Syne’,sans-serif;font-size:13px;font-weight:700;color:var(–txt);padding-bottom:4px;border-bottom:1px solid var(–bor);margin-bottom:8px;}

::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(–bor);border-radius:3px;}
</style>

</head>

<script>
// ═══════════ CONSTANTS ═══════════
const DAYS=['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi','Dimanche'];
const DS=['LUN','MAR','MER','JEU','VEN','SAM','DIM'];
const OPEN_H={0:'07:45',1:'08:00',2:'07:45',3:'08:00',4:'07:45',5:'08:00',6:null};
const CLOSE_H={0:'19:30',1:'19:30',2:'19:30',3:'19:30',4:'19:30',5:'18:30',6:null};

// ═══════════ STATE ═══════════
let team=[], planning={}, currentWeek=null, weekType='A', modalTarget=null;

// ═══════════ UTILS ═══════════
const toMin=t=>{if(!t)return 0;const[h,m]=t.split(':').map(Number);return h*60+m;};
const toHHMM=m=>{const h=Math.floor(m/60),mm=m%60;return`${String(h).padStart(2,'0')}:${String(mm).padStart(2,'0')}`;};
const rnd=(a,b)=>Math.round(a+Math.random()*(b-a));

function getWeekNumber(d){
  const date=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  date.setUTCDate(date.getUTCDate()+4-(date.getUTCDay()||7));
  const y=new Date(Date.UTC(date.getUTCFullYear(),0,1));
  return Math.ceil((((date-y)/86400000)+1)/7);
}

function getWeekDates(ws){
  if(!ws)return[];
  const[yr,wPart]=ws.split('-W');
  const year=parseInt(yr),week=parseInt(wPart);
  const jan4=new Date(year,0,4);
  const sow=new Date(jan4);
  sow.setDate(jan4.getDate()-(jan4.getDay()||7)+1);
  const mon=new Date(sow);
  mon.setDate(sow.getDate()+(week-1)*7);
  return Array.from({length:7},(_,i)=>{const d=new Date(mon);d.setDate(mon.getDate()+i);return d;});
}

function dateToStr(d){return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}

function cfg(id,def){return parseFloat(document.getElementById(id)?.value||def)||def;}
function cfgS(id,def){return document.getElementById(id)?.value||def;}

// ═══════════ INIT ═══════════
window.onload=()=>{
  const now=new Date();
  const w=getWeekNumber(now);
  currentWeek=`${now.getFullYear()}-W${String(w).padStart(2,'0')}`;
  document.getElementById('weekPicker').value=currentWeek;
  document.getElementById('weekPicker2').value=currentWeek;
  updateWeekType();
  team=[
    {name:'Alice',hours:35,restDays:[6],samWeek:'A',conges:[]},
    {name:'Bruno',hours:35,restDays:[1,6],samWeek:'B',conges:[]},
    {name:'Camille',hours:30,restDays:[6],samWeek:'A',conges:[]},
    {name:'Dylan',hours:35,restDays:[4,6],samWeek:'B',conges:[]},
    {name:'Emma',hours:35,restDays:[6],samWeek:'A',conges:[]},
    {name:'Félix',hours:30,restDays:[2,6],samWeek:'B',conges:[]},
    {name:'Grace',hours:35,restDays:[6],samWeek:'A',conges:[]},
    {name:'Hugo',hours:35,restDays:[3,6],samWeek:'B',conges:[]},
  ];
  document.getElementById('teamSize').value=team.length;
  document.getElementById('teamSizeDisplay').textContent=team.length;
  renderTeam();
  updateBadges();
  renderFavs();
};

// ═══════════ WEEK ═══════════
function onWeekChange(){
  currentWeek=document.getElementById('weekPicker').value;
  document.getElementById('weekPicker2').value=currentWeek;
  updateWeekType();
}
function syncWeek(el){
  currentWeek=el.value;
  document.getElementById('weekPicker').value=currentWeek;
  updateWeekType();
  if(Object.keys(planning).length) renderPlanning();
}
function updateWeekType(){
  if(!currentWeek)return;
  const w=parseInt(currentWeek.split('W')[1]);
  weekType=(w%2===0)?'B':'A';
  ['wkTypeBadge','wkTypeBadge2'].forEach(id=>{
    const el=document.getElementById(id);
    if(el){el.textContent=`Semaine ${weekType}`;el.className=`wbadge b${weekType.toLowerCase()}`;}
  });
  const wl=document.getElementById('wkLabel');
  if(wl) wl.textContent=`Sem.${currentWeek.split('W')[1]} — Type ${weekType}`;
}

// ═══════════ TEAM ═══════════
function stepTeam(d){
  const inp=document.getElementById('teamSize');
  let v=parseInt(inp.value)||8;
  v=Math.max(1,Math.min(20,v+d));
  inp.value=v;
  document.getElementById('teamSizeDisplay').textContent=v;
  // Auto-update team list immediately
  buildTeam();
}
function buildTeam(){
  const n=parseInt(document.getElementById('teamSize').value)||8;
  const old=team.slice();
  team=Array.from({length:n},(_,i)=>old[i]||{name:`Employé ${i+1}`,hours:35,restDays:[6],samWeek:'none',conges:[]});
  renderTeam();updateBadges();planning={};

function toggleRest(i,di,checked){

// ═══════════ REST / CONGE ═══════════
function isRestDay(emp,dayIdx){
  if(dayIdx===6)return true;
  if(emp.restDays.includes(dayIdx))return true;
  if(dayIdx===5){
    if(emp.samWeek==='AB')return true;
    if(emp.samWeek==='A'&&weekType==='A')return true;
    if(emp.samWeek==='B'&&weekType==='B')return true;
  }
  return false;
}
function isCongeDay(emp,dayIdx){
  if(!emp.conges||emp.conges.length===0)return false;
  const dates=getWeekDates(currentWeek);
  if(!dates[dayIdx])return false;
  const dStr=dateToStr(dates[dayIdx]);
  return emp.conges.some(c=>c.from&&c.to&&dStr>=c.from&&dStr<=c.to);
}

// ═══════════ HOURS CALC ═══════════
function calcSlotHours(sl){
  if(!sl||sl.repos||sl.conge||!sl.arrive||!sl.depart)return 0;
  const a=toMin(sl.arrive),d=toMin(sl.depart);
  const ps=toMin(sl.pauseS||'12:00'),pe=toMin(sl.pauseE||'13:00');
  return Math.max(0,(d-a-(pe-ps)))/60;
}
function calcCongeHours(dayIdx){
  const open=OPEN_H[dayIdx],close=CLOSE_H[dayIdx];
  if(!open||!close)return 0;
  const pMin=cfg('pauseMin',1);
  return Math.round(((toMin(close)-toMin(open))/60-pMin)*10)/10;
}
function calcTotalHours(empIdx){
  let t=0;
  for(let d=0;d<6;d++){
    const sl=planning[empIdx]?.[d];
    if(!sl)continue;
    if(sl.conge){t+=calcCongeHours(d);continue;}
    t+=calcSlotHours(sl);
  }
  return Math.round(t*10)/10;
}

// ═══════════ AUTO FILL ═══════════
function initPlanning(){
  planning={};
  team.forEach((emp,i)=>{
    planning[i]={};
    for(let d=0;d<7;d++){
      if(d===6||isRestDay(emp,d)) planning[i][d]={repos:true,conge:false};
      else if(isCongeDay(emp,d)) planning[i][d]={repos:false,conge:true};
      else planning[i][d]=null;
    }
  });
}

function autoFill(){
  initPlanning();
  const pauseMinH=cfg('pauseMin',1);
  const pauseMaxH=cfg('pauseMax',2);
  const pStartMin=toMin(cfgS('pauseStart','11:00'));
  const pEndMax=toMin(cfgS('pauseEnd','15:00'));
  const minLMV=cfg('minLMV',4);
  const minMJS=cfg('minMJS',3);

  // For each day, assign shifts
  for(let d=0;d<6;d++){
    const openM=toMin(OPEN_H[d]);
    const closeM=toMin(CLOSE_H[d]);
    const isLMV=[0,2,4].includes(d);
    const minStaff=isLMV?minLMV:minMJS;
    const dayDuration=(closeM-openM)/60;

    // Workers available (not rest, not conge)
    const avail=team.map((emp,i)=>({emp,i})).filter(({emp,i})=>{
      return !isRestDay(emp,d)&&!isCongeDay(emp,d);
    });
    if(!avail.length)continue;

    // Sort by hours deficit (most needed first)
    avail.sort((a,b)=>{
      const ra=a.emp.hours-calcTotalHours(a.i);
      const rb=b.emp.hours-calcTotalHours(b.i);
      return rb-ra;
    });

    // Days remaining in week (including today)
    const daysLeft=avail.map(({emp,i})=>{
      let dl=0;
      for(let dd=d;dd<6;dd++){
        if(!isRestDay(emp,dd)&&!isCongeDay(emp,dd)) dl++;
      }
      return{...({emp,i}),daysLeft:Math.max(1,dl)};
    });

    daysLeft.forEach(({emp,i,daysLeft},idx)=>{
      const hoursLeft=Math.max(0,emp.hours-calcTotalHours(i));
      // Target hours today: distribute evenly over remaining days, min 3h if needed
      const target=Math.min(dayDuration-pauseMinH, Math.max(0, hoursLeft/daysLeft));
      if(target<1&&idx>=minStaff) return; // skip if not needed and already have min staff

      // Generate pause duration: random between min and max, capped so shift fits
      const maxPossiblePause=Math.min(pauseMaxH,(dayDuration-target));
      const pauseH=pauseMinH+Math.random()*Math.max(0,maxPossiblePause-pauseMinH);
      const pauseM=Math.round(pauseH*60);

      // Pause start: random between pStartMin and pEndMax - pauseM
      const latestPauseStart=pEndMax-pauseM;
      const pauseStart=rnd(pStartMin,Math.max(pStartMin,latestPauseStart));
      const pauseEnd=pauseStart+pauseM;

      // Total shift = target work + pause
      const totalShift=Math.round(target*60)+pauseM;

      // Arrive: at open or slightly staggered for non-priority staff
      const arriveOffset=idx>=minStaff?rnd(0,30):0;
      const arrive=openM+arriveOffset;

      // Depart
      const depart=Math.min(closeM,arrive+totalShift);

      // Recalculate effective work hours
      const actualWork=Math.max(0,(depart-arrive-pauseM))/60;
      if(actualWork<0.5&&idx>=minStaff) return;

      planning[i][d]={
        arrive:toHHMM(arrive),
        pauseS:toHHMM(pauseStart),
        pauseE:toHHMM(pauseEnd),
        depart:toHHMM(depart),
        repos:false,conge:false
      };
    });
  }

  renderPlanning();
  toast('⚡ Planning généré ! Tapez une cellule pour modifier.');
  showTab('planning',document.querySelectorAll('.tab')[1]);
}

function renderPlanning(){
  const wrap=document.getElementById('planningTableWrapper');
  if(!wrap)return;

  let html=`<table class="ptbl"><thead><tr><th class="col-emp">Employé</th>`;
  for(let d=0;d<7;d++){
    const o=OPEN_H[d],c=CLOSE_H[d];
    html+=`<th class="day-hdr" style="min-width:115px;">
      <div class="dn">${DAYS[d].slice(0,3).toUpperCase()}</div>
      <div class="dh">${o?`${o}–${c}`:'Fermé'}</div>
    </th>`;
  }
  html+=`<th style="min-width:70px;font-size:10px;">Heures</th></tr></thead><tbody>`;

  team.forEach((emp,i)=>{
    const tot=calcTotalHours(i);
    const diff=Math.round((tot-emp.hours)*10)/10;
    const hc=diff>0?'hov':diff<0?'hun':'hok';
    const hs=diff>0?`+${diff}h`:diff<0?`${diff}h`:'✓';
    const hbg=diff>0?'rgba(78,205,196,.08)':diff<0?'rgba(255,77,109,.08)':'rgba(6,214,160,.08)';

    html+=`<tr>
      <td class="col-emp">
        <div style="display:flex;flex-direction:column;gap:1px;padding:6px 0;">
          <span style="font-weight:600;font-size:12px;white-space:nowrap;">${emp.name}</span>
          <span style="font-size:9px;color:var(--t3);font-family:'DM Mono',monospace;">${emp.hours}h/sem</span>
        </div>
      </td>`;

    for(let d=0;d<7;d++){
      if(d===6){
        html+=`<td class="cell cell-closed"><div class="cell-inner"><span style="font-size:9px;color:var(--t3);">Fermé</span></div></td>`;
        continue;
      }
      const sl=planning[i]?.[d];
      let cls='cell ';
      let inner='';

      if(!sl||sl.repos){
        cls+='cell-repos';
        inner=`<span class="slot-time">REPOS</span>`;
      } else if(sl.conge){
        cls+='cell-conge';
        const ch=calcCongeHours(d);
        inner=`<span class="slot-time">🌿 CONGÉ</span><span class="slot-pause">${ch}h comptées</span>`;
      } else if(sl.arrive){
        cls+='cell-work';
        const wh=Math.round(calcSlotHours(sl)*10)/10;
        inner=`<span class="slot-time">${sl.arrive}/${sl.pauseS}</span>
               <span class="slot-pause">pause ${sl.pauseS}–${sl.pauseE}</span>
               <span class="slot-time">${sl.pauseE}/${sl.depart}</span>
               <span class="slot-pause" style="color:var(--a2);">${wh}h</span>`;
      } else {
        cls+='cell-empty';
        inner=`<span class="slot-time" style="color:var(--t3);">—</span>`;
      }

      html+=`<td class="${cls}" onclick="openModal(${i},${d})"><div class="cell-inner">${inner}</div></td>`;
    }

    html+=`<td class="hcell ${hc}" style="background:${hbg}">
      <div class="hval ${hc}">${tot}h</div>
      <div class="hexp">${hs} / ${emp.hours}h</div>
    </td></tr>`;
  });

  html+=buildCountRows();
  html+=`</tbody></table>`;
  wrap.innerHTML=html;
  renderRecap();
}

function buildCountRows(){
  const ml=cfg('minLMV',4),mm=cfg('minMJS',3),md=cfg('minMidi',2);
  let r1=`<tr class="cntrow"><td class="col-emp" style="text-align:left;padding-left:8px;">👥 Présents</td>`;
  let r2=`<tr class="cntrow"><td class="col-emp" style="text-align:left;padding-left:8px;">🕛 Midi ≥${md}</td>`;
  for(let d=0;d<7;d++){
    if(d===6){r1+=`<td>—</td>`;r2+=`<td>—</td>`;continue;}
    const isLMV=[0,2,4].includes(d);
    const minS=isLMV?ml:mm;
    const p=countPresent(d),mi=countMidi(d);
    r1+=`<td class="${p>=minS?'cok':'clow'}">${p}/${minS}</td>`;
    r2+=`<td class="${mi>=md?'cok':'clow'}">${mi} ${mi>=md?'✓':'⚠'}</td>`;
  }
  r1+=`<td></td></tr>`;r2+=`<td></td></tr>`;
  return r1+r2;
}

function countPresent(d){
  return team.filter((_,i)=>{
    const sl=planning[i]?.[d];
    return sl&&!sl.repos&&!sl.conge&&sl.arrive;
  }).length;
}
function countMidi(d){
  return team.filter((_,i)=>{
    const sl=planning[i]?.[d];
    if(!sl||sl.repos||sl.conge||!sl.arrive||!sl.depart)return false;
    return toMin(sl.arrive)<=toMin('12:30')&&toMin(sl.depart)>=toMin('13:00');
  }).length;
}

// ═══════════ MODAL ═══════════
function openModal(empIdx,dayIdx){
  if(dayIdx===6)return;
  modalTarget={empIdx,dayIdx};
  const sl=planning[empIdx]?.[dayIdx];
  const o=OPEN_H[dayIdx],c=CLOSE_H[dayIdx];
  document.getElementById('modalTitle').textContent=`${team[empIdx].name} — ${DAYS[dayIdx]}`;
  document.getElementById('mArrive').value=sl?.arrive||o||'';
  document.getElementById('mPauseS').value=sl?.pauseS||'12:00';
  document.getElementById('mPauseE').value=sl?.pauseE||'13:00';
  document.getElementById('mDepart').value=sl?.depart||c||'';
  document.getElementById('mRepos').checked=sl?.repos||false;
  document.getElementById('mConge').checked=sl?.conge||false;
  updateModalH();
  document.getElementById('modalBg').style.display='flex';
}
function updateModalH(){
  const a=document.getElementById('mArrive').value;
  const ps=document.getElementById('mPauseS').value;
  const pe=document.getElementById('mPauseE').value;
  const dep=document.getElementById('mDepart').value;
  if(a&&ps&&pe&&dep){
    const w=Math.max(0,(toMin(dep)-toMin(a)-(toMin(pe)-toMin(ps)))/60);
    const p=(toMin(pe)-toMin(ps))/60;
    document.getElementById('modalHours').textContent=`⏱ ${Math.round(w*10)/10}h travaillées · pause ${Math.round(p*10)/10}h`;
  }
}
function saveModal(){
  if(!modalTarget)return;
  const{empIdx,dayIdx}=modalTarget;
  if(document.getElementById('mRepos').checked){
    planning[empIdx][dayIdx]={repos:true,conge:false};
  } else if(document.getElementById('mConge').checked){
    planning[empIdx][dayIdx]={repos:false,conge:true};
  } else {
    planning[empIdx][dayIdx]={
      arrive:document.getElementById('mArrive').value,
      pauseS:document.getElementById('mPauseS').value,
      pauseE:document.getElementById('mPauseE').value,
      depart:document.getElementById('mDepart').value,
      repos:false,conge:false
    };
  }
  document.getElementById('modalBg').style.display='none';
  modalTarget=null;
  renderPlanning();
}
function closeModal(e){
  if(e&&e.target!==document.getElementById('modalBg'))return;
  document.getElementById('modalBg').style.display='none';
  modalTarget=null;
}

// ═══════════ RECAP ═══════════
function renderRecap(){
  const el=document.getElementById('recapContent');
  if(!el)return;
  if(!Object.keys(planning).length){el.innerHTML=`<p style="color:var(--t3)">Générez d'abord un planning.</p>`;return;}

  let html=`<div class="rcards">`;
  team.forEach((emp,i)=>{
    const tot=calcTotalHours(i);
    const diff=Math.round((tot-emp.hours)*10)/10;
    const col=diff>0?'var(--a2)':diff<0?'var(--red)':'var(--grn)';
    const sign=diff>0?`+${diff}h`:diff<0?`${diff}h`:'✓';
    html+=`<div class="rcard">
      <div style="font-weight:700;font-size:13px;margin-bottom:6px;">${emp.name}</div>
      <div style="font-family:'DM Mono',monospace;font-size:20px;font-weight:700;color:${col};margin-bottom:4px;">${tot}h <span style="font-size:12px;">${sign}</span></div>
      <div style="background:var(--s3);border-radius:4px;height:5px;overflow:hidden;margin-bottom:6px;">
        <div style="height:100%;background:${col};width:${Math.min(100,(tot/emp.hours)*100)}%;"></div>
      </div>
      <div style="font-size:9px;color:var(--t3);margin-bottom:8px;">Contrat ${emp.hours}h/sem</div>
      <div style="display:flex;flex-direction:column;gap:2px;">
        ${Array.from({length:6},(_,d)=>{
          const sl=planning[i]?.[d];
          if(!sl||sl.repos)return`<div style="font-size:10px;font-family:'DM Mono',monospace;color:var(--t3);">${DS[d].slice(0,3)} — Repos</div>`;
          if(sl.conge)return`<div style="font-size:10px;font-family:'DM Mono',monospace;color:var(--grn);">${DS[d].slice(0,3)} 🌿 Congé</div>`;
          if(!sl.arrive)return`<div style="font-size:10px;font-family:'DM Mono',monospace;color:var(--t3);">${DS[d].slice(0,3)} —</div>`;
          const wh=Math.round(calcSlotHours(sl)*10)/10;
          return`<div style="font-size:10px;font-family:'DM Mono',monospace;color:var(--t2);">${DS[d].slice(0,3)} ${sl.arrive}→${sl.depart} (${wh}h)</div>`;
        }).join('')}
      </div>
    </div>`;
  });
  html+=`</div>`;

  const ml=cfg('minLMV',4),mm=cfg('minMJS',3),md=cfg('minMidi',2);
  html+=`<div style="margin-top:14px;background:var(--sur);border:1px solid var(--bor);border-radius:10px;padding:14px;">
  <div class="section-title">Vérification contraintes</div>
  <table style="width:100%;border-collapse:collapse;">
  <thead><tr><th style="text-align:left;padding:5px 8px;font-size:10px;color:var(--t2);border-bottom:1px solid var(--bor);">Contrainte</th>
  ${Array.from({length:6},(_,d)=>`<th style="text-align:center;padding:5px;font-size:10px;color:var(--t2);border-bottom:1px solid var(--bor);">${DAYS[d].slice(0,3)}</th>`).join('')}
  </tr></thead><tbody>`;
  [{label:'Présents',fn:d=>{const c=countPresent(d),m=[0,2,4].includes(d)?ml:mm;return{ok:c>=m,v:`${c}/${m}`};}},
   {label:'Midi',fn:d=>{const c=countMidi(d);return{ok:c>=md,v:`${c}/${md}`};}}
  ].forEach(row=>{
    html+=`<tr><td style="padding:5px 8px;font-size:11px;color:var(--t2);border-bottom:1px solid var(--bor);">${row.label}</td>`;
    for(let d=0;d<6;d++){const r=row.fn(d);html+=`<td style="text-align:center;padding:5px;font-size:11px;border-bottom:1px solid var(--bor);color:${r.ok?'var(--grn)':'var(--red)'};">${r.v} ${r.ok?'✓':'✗'}</td>`;}
    html+=`</tr>`;
  });
  html+=`</tbody></table></div>`;
  el.innerHTML=html;
}

  if(!el){toast('Allez sur le planning !');return;}
  try{
    const canvas=await html2canvas(el,{backgroundColor:'#0f0f13',scale:1.5,useCORS:true});
    const{jsPDF}=window.jspdf;
    const pdf=new jsPDF({orientation:'landscape',unit:'mm',format:'a3'});
    const img=canvas.toDataURL('image/png');
    const pw=pdf.internal.pageSize.getWidth(),ph=pdf.internal.pageSize.getHeight();
    const ratio=canvas.width/canvas.height;
    let w=pw-20,h=w/ratio;
    if(h>ph-20){h=ph-20;w=h*ratio;}
    pdf.addImage(img,'PNG',10,10,w,h);
    pdf.save(`planning-${currentWeek}.pdf`);
    toast('✅ PDF téléchargé !');
  }catch(e){toast('Erreur PDF, essayez impression.');}
}

// ═══════════ UI ═══════════
function showTab(name,btn){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById(`page-${name}`).classList.add('active');
  if(btn)btn.classList.add('active');
  if(name==='recap')renderRecap();
  if(name==='favs')renderFavs();
}
function toast(msg,dur=2800){
  const el=document.getElementById('toast');
  el.textContent=msg;
  el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),dur);
}
</script>
